
# Application
spring.application.name=card-transaction-api
server.port=8080

# SQL Server Database Connection
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TESTDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Save application logs to a file
logging.file.name=logs/card-transaction-api.log

# General log level
logging.level.root=INFO

# Log level for our application
logging.level.com.cards.transaction=INFO

# Rotate log files to avoid unlimited growth
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=50MB

# Third-party exchange-rate provider
exchange-rate.api.base-url=https://api.frankfurter.dev

# Outbound connection timeout
exchange-rate.api.connect-timeout=3s

# Time allowed to read the response
exchange-rate.api.read-timeout=5s
